name: schemapilot-integration

services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: schemapilot
      POSTGRES_PASSWORD: schemapilot
      POSTGRES_USER: schemapilot
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schemapilot -d schemapilot"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql

  mysql:
    image: mysql:9.6.0
    environment:
      MYSQL_DATABASE: schemapilot
      MYSQL_PASSWORD: schemapilot
      MYSQL_ROOT_PASSWORD: schemapilot-root
      MYSQL_USER: schemapilot
    ports:
      - "127.0.0.1::3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 3s
      retries: 45
    tmpfs:
      - /var/lib/mysql

