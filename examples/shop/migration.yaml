version: 1
name: shop
parallelism: 2
on_error: halt
nodes:
  order-schema:
    database: primary
    scripts:
      - sql/order/001_create_orders.sql
  report-schema:
    database: reporting
    depends_on:
      - order-schema
      - user-schema
    scripts:
      - sql/report/001_create_order_report.sql
  user-schema:
    database: primary
    scripts:
      - sql/user/001_create_users.sql
      - sql/user/002_add_user_email.sql
